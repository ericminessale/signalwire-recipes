# The QC gate, run on every push and pull request.
#
# Until now nothing enforced it except a person remembering to. Every check
# here is a bug that shipped once, so a green run is the claim that none of
# them has come back.
#
# The site build is Vercel's job. This workflow is the gate, and its failure
# is what should stop a deploy.
name: gate

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the tooling
        run: pip install -r requirements.txt

      - name: Install what the recipes import
        # A verifier imports its recipe's app.py, so the runner needs what the
        # recipes need, not only what the generator needs. Derived from the
        # recipe files rather than restated here, so a recipe adding a
        # dependency cannot leave CI behind. The exact SDK pin comes along
        # with it, since every recipe pins it exactly, and a newer SDK on the
        # path is how a "verified" run once turned out to have tested
        # something else.
        run: |
          cat recipes/*/python/requirements.txt 2>/dev/null | sed 's/#.*//' | tr -d '\r' | sed 's/[[:space:]]*$//' | grep -v '^$' | sort -u > /tmp/recipe-reqs.txt
          echo "installing:"
          cat /tmp/recipe-reqs.txt
          pip install -r /tmp/recipe-reqs.txt

      - name: Prose, structure and required files
        run: python tools/lint_recipes.py

      - name: Public tree contains no internal project state
        run: python tools/check_public_tree.py

      - name: The generated index is current
        run: python tools/gen_index.py --check

      - name: Build
        run: python build.py

      - name: Vocabulary stays out of the generator
        run: python check_extensible.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install what the typescript surfaces import
        # Without this the type-check inside those verifiers has nothing to
        # run, and it used to say so and pass. Every typescript surface commits
        # its package-lock.json, so npm ci is exact.
        run: |
          for lock in recipes/*/typescript/package-lock.json; do
            dir="$(dirname "$lock")"
            echo "npm ci in $dir"
            (cd "$dir" && npm ci --no-audit --no-fund)
          done

      - name: Every recipe proves its claim
        # verify.py puts SIGNALWIRE_SDK_PATH on PYTHONPATH, so it wants the
        # directory *containing* the package. Locally that is the vendored
        # checkout; on a runner it is site-packages.
        #
        # SIGNALWIRE_REQUIRE_TSC refuses the "not type-checked" fallback here,
        # where the dependency was just installed.
        run: |
          export SIGNALWIRE_SDK_PATH="$(python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
          export SIGNALWIRE_REQUIRE_TSC=1
          python verify.py

  render:
    # The render checks need a browser, so they get their own job and do not
    # hold up the fast feedback above.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the tooling
        run: pip install -r requirements.txt

      - name: Install playwright-cli
        run: |
          npm install -g @playwright/cli
          npx playwright install --with-deps chromium

      - name: Build the preview at full volume
        run: |
          python build.py
          python build.py --preview --all

      - name: Render checks at five widths
        run: python tools/qc.py
