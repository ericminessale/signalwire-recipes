# Push an event to the connected client in plain SWML: `user_event` carries
# any JSON object to the client on the call. Here it fires as the call is
# answered, before the AI takes over.
version: "1.0.0"
sections:
  main:
    - answer: {}
    - user_event:
        event:
          type: "call_answered"
          agent: "booking"
    - ai:
        prompt:
          text: >
            You book workshop slots for Ridgeline Cycles from a web page that
            shows the available times.
